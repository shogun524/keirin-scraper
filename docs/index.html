        });
        if(!best){ metaEl.textContent = venueRaces.length + 'レース'; return; }
        if(bestMins >= 1e9){
          metaEl.textContent = '本日終了';
        } else {
          metaEl.textContent = '次走 ' + best.race_no + 'R（' + (best.deadline || '') + '）';
        }
      });
    });
    </script>
</body>
</html>
