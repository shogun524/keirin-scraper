name: 締切直前オッズの記録(netkeirin・30〜60秒おき)
# winticket がクラウドからのアクセスを止めたため(11/15)、netkeirin の API で締切直前のオッズを細かく取り、
# 「締切直前に動いた買い目」(docs/drops.html)を約2分おきに作り直す。1回の実行は最大5時間40分なので1日3回に分けて起動する。
on:
  schedule:
    - cron: "40 22 * * *"   # JST 07:40 〜 13:20
    - cron: "15 4 * * *"    # JST 13:15 〜 18:55
    - cron: "50 9 * * *"    # JST 18:50 〜 24:30(ミッドナイトは翌日分なので 23:59 まで)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nk-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests
      - name: 今日の記録をリリースから戻す(途中から再開できるように)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p live
          f="nk_live_$(TZ=Asia/Tokyo date +%Y%m%d).jsonl.gz"
          gh release download wt-odds-live -p "$f" -D live 2>/dev/null || echo "まだ記録なし"
          gh api repos/${{ github.repository }}/contents/docs/_drops_results.json >/dev/null 2>&1 || true
      - name: 記録し続ける
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ "$H" -lt 13 ]; then U=13:25; elif [ "$H" -lt 18 ]; then U=19:00; else U=23:59; fi
          cd scripts && python nk_watch.py --until $U --push
