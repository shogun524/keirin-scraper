name: 診断(一時) Kドリームス開催一覧
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests beautifulsoup4 numpy
      - run: |
          cd scripts
          python - <<'PY'
          import scraper, datetime, re, nk_api
          for u in ("https://keirin.kdreams.jp/kaisai/2026/11/16/","https://keirin.kdreams.jp/"):
              h=scraper._get(u); print(u,len(h)); print("racecard links:",sorted(set(re.findall(r'/[a-z]+/racecard/\d+',h)))[:30])
              print("extract:",scraper._extract_todays_links_from_kaisai_html(h))
              i=h.find("本日の開催"); print("本日の開催 at",i, re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",h[i:i+1500]))[:600] if i>=0 else "")
          rl=nk_api.race_list("20261116"); print("netkeirin races",len(rl), sorted({(r["venue"],r["jyo_cd"]) for r in rl}))
          PY
