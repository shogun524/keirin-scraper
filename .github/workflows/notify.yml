name: 締切通知チェック（5分おき）

on:
  schedule:
    # 5分おきに実行。GitHub Actionsのcronは常にUTC指定、実際の発火は数分ずれることがある。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 常駐更新(keeper.yml)が止まっていれば起こす（朝のcronが間引かれたときの保険）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hm=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$hm" -ge 0700 ] && [ "$hm" -lt 2300 ]; then
            n=$(gh run list --workflow keeper.yml --limit 5 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length')
            if [ "$n" = "0" ]; then gh workflow run keeper.yml --ref "${GITHUB_REF_NAME}" && echo "keeper を起動しました"; fi
          fi
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 締切をチェックして通知を送る
        working-directory: scripts
        env:
          # ここを他人に推測されにくいランダムな文字列に変更してください
          # （ntfy.shはトピック名を知っていれば誰でも購読・送信できる公開サービスのため）
          NTFY_TOPIC: "keirin-alert-CHANGE-ME-8f3ac2b1"
          # GitHub PagesのURL（通知をタップした時に開くリンク用。任意）
          PAGES_BASE_URL: "https://YOUR_USERNAME.github.io/YOUR_REPO"
        run: python notify_check.py

      - name: 送信済み記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_notified.json
          git diff --staged --quiet || git commit -m "chore: 通知送信済み記録を更新"
          git push
