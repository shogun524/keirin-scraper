name: 競輪AI予想 自動更新（1時間おき）

on:
  schedule:
    # 1時間おきに実行（UTC指定）。並び予想はレース当日の日中〜夕方にかけて
    # 随時サイトに公開されるため、朝1回だけの実行だと夜のレースの並び予想に
    # 間に合わないことがある。1時間おきに再実行することで、後から公開された
    # 並び予想も次の実行で拾えるようにする。
    - cron: "0 * * * *"
  workflow_dispatch: {}  # 手動実行用ボタンも使えるようにする

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 予想を生成
        working-directory: scripts
        env:
          PYTHONIOENCODING: "utf-8"
        run: python run_daily.py

      - name: 生成結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: 本日の予想を自動更新 ($(date +'%Y-%m-%d'))"
          git push
