name: 競輪AI予想 毎朝自動更新

on:
  schedule:
    # UTC 21:30 = 日本時間(JST) 06:30。GitHub Actionsのcronは常にUTC指定。
    - cron: "30 21 * * *"
  workflow_dispatch: {}  # 手動実行用ボタンも使えるようにする

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 予想を生成
        working-directory: scripts
        env:
          PYTHONIOENCODING: "utf-8"
        run: python run_daily.py

      - name: 生成結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: 本日の予想を自動更新 ($(date +'%Y-%m-%d'))"
          git push
