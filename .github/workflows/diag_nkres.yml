name: 診断 netkeirinの結果を取る
on:
  workflow_dispatch:
    inputs:
      date:
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/nk_results.py "${{ github.event.inputs.date }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload diag /tmp/nk_results.json --clobber
