name: 締切直前オッズの記録（10分おき・CLV用）

on:
  schedule:
    # 10分おき。締切の1〜12分前のレースがあるときだけ winticket にオッズを取りに行く。
    # GitHub Actionsのcronは数分ずれることがある。
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: closing-odds
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 締切直前のオッズを記録（失敗しても他は止めない）
        continue-on-error: true
        working-directory: scripts
        env:
          PYTHONIOENCODING: "utf-8"
        run: python closing_odds.py

      - name: 記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_close_odds.json
          git diff --staged --quiet || git commit -m "chore: 締切直前オッズを記録"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
