name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, re
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for u in ["https://cdnv2.netkeiba.com/keirin/race/odds/tags/race_odds.min.js?20260408","https://cdnv2.netkeiba.com/keirin/api/race/common/js/race_api_indexdb.min.js?210616"]:
              r=S.get(u,timeout=20); n=u.split("/")[-1].split("?")[0]; open(n,"wb").write(r.content); print(r.status_code,len(r.content),n)
              t=r.text
              for m in re.finditer(r"api_url|\.html|pid\s*[:=]",t):
                  print("  ",n,"::",t[max(0,m.start()-160):m.start()+200].replace("\n"," "))
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
