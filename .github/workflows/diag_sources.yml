name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, re
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          u="https://keirin.kdreams.jp/beppu/raceresult/86202611150100/"
          r=S.get(u,timeout=20); open("kd_result_day.html","wb").write(r.content); t=r.text; print(r.status_code,len(t),t.count("3連単"))
          for m in list(re.finditer("3連単",t))[:6]:
              seg=re.sub(r"<[^>]+>","|",t[m.start()-300:m.start()+500]); seg=re.sub(r"\s+"," ",seg); seg=re.sub(r"(\| ?)+","|",seg); print("   ",seg[:400])
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
