name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, json
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          r=S.post("https://keirin.netkeiba.com/api/race/",data=dict(input="UTF-8",output="json",**{"class":"AplRace"},method="get",compress="0",kaisai_date="20261115",syusai=""),timeout=20)
          d=r.json()["data"]; v=list(d.values())[0]
          print("VENUE_KEYS", {k:(x if not isinstance(x,list) else len(x)) for k,x in v[0].items()})
          print("RACE", json.dumps(v[0]["list"][0],ensure_ascii=False))
          for vv in v: print("V", vv.get("jyo"), vv.get("jyo_cd"), {k:vv.get(k) for k in vv if k not in ("list",)} )
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
