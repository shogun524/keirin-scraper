name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, re
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for u in ["https://keirin.kdreams.jp/beppu/racedetail/8620261115010001/","https://keirin.kdreams.jp/beppu/racedetail/8620261115010001/result/",
                    "https://keirin.netkeiba.com/race/result/?race_id=202611152801","https://keirin.netkeiba.com/race/result/?race_id=202611152801&rf=race_list"]:
              r=S.get(u,timeout=20); n=re.sub(r"\W","_",u[8:])[:80]+".html"; open(n,"wb").write(r.content)
              t=r.text; k=t.count("3連単"); print(r.status_code,len(t),k,u)
              for m in list(re.finditer("3連単",t))[:4]:
                  seg=re.sub(r"<[^>]+>","|",t[m.start():m.start()+400]); seg=re.sub(r"\s+"," ",seg); seg=re.sub(r"(\| ?)+","|",seg); print("   ",seg[:200])
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
