name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, re, json
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36","Accept-Language":"ja"}
          S=requests.Session(); S.headers.update(UA)
          def save(name,u,**kw):
              r=S.get(u,timeout=20,**kw); open(name,"wb").write(r.content); print(r.status_code,len(r.content),name,r.url); return r
          r=save("nk_api_list.html","https://keirin.netkeiba.com/race/api_race_list.html",params=dict(pid="api_race_list",input="UTF-8",output="html",kaisai_date="20261115",jyocd="",link_mode=""))
          ids=sorted(set(re.findall(r"race_id=(\d{10,})",r.text))); print("ids",len(ids),ids[:6])
          if ids:
              rid=ids[len(ids)//2]
              save("nk_odds.html",f"https://keirin.netkeiba.com/race/odds/?race_id={rid}")
              save("nk_entry.html",f"https://keirin.netkeiba.com/race/entry/?race_id={rid}")
              save("nk_result.html",f"https://keirin.netkeiba.com/race/result/?race_id={ids[0]}")
              h=open("nk_odds.html",encoding="utf-8",errors="replace").read()
              apis=sorted(set(re.findall(r'["\'](/[a-z_/]*api[a-zA-Z0-9_/\.\-]*)["\']',h))); print("odds page apis",apis)
              for a in apis:
                  for typ in ["","8","b8","1","3t"]:
                      try:
                          q=dict(pid=a.split("/")[-1].split(".")[0],input="UTF-8",output="json",race_id=rid,type=typ,action="init")
                          rr=S.get("https://keirin.netkeiba.com"+a,params=q,timeout=20); print("API",a,typ,rr.status_code,len(rr.content),rr.text[:300].replace("\n"," "))
                          open("api_"+a.split("/")[-1]+"_"+typ+".txt","wb").write(rr.content)
                      except Exception as e: print("ERR",a,e)
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
