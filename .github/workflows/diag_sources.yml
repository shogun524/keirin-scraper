name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, re
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36","Accept-Language":"ja"}
          S=requests.Session(); S.headers.update(UA)
          def save(name,u):
              r=S.get(u,timeout=20); open(name,"wb").write(r.content); print(r.status_code,len(r.content),name,u); return r
          r=save("nk_list.html","https://keirin.netkeiba.com/race/race_list/?kaisai_date=20261115")
          ids=sorted(set(re.findall(r"race_id=(\d{12,})",r.text)))[:400]; print("nk ids",len(ids),ids[:10])
          if ids:
              rid=ids[len(ids)//2]
              save("nk_odds.html",f"https://keirin.netkeiba.com/race/odds/?race_id={rid}")
              save("nk_odds3t.html",f"https://keirin.netkeiba.com/race/odds/?race_id={rid}&type=b8")
              save("nk_shutuba.html",f"https://keirin.netkeiba.com/race/entry/?race_id={rid}")
              save("nk_result.html",f"https://keirin.netkeiba.com/race/result/?race_id={ids[0]}")
          r=save("kd_card.html","https://keirin.kdreams.jp/racecard/")
          links=sorted(set(re.findall(r'href="(https://keirin\.kdreams\.jp/[a-z]+/racedetail/\d+/?)"',r.text)))
          links=[l for l in links if "20261115" in l]; print("kd links today",len(links),links[:3])
          if links:
              L=links[min(5,len(links)-1)]
              save("kd_detail.html",L)
              for t in ["odds/","odds/3rentan/","odds/?type=3rentan"]:
                  save("kd_odds_"+re.sub(r"\W","_",t)+".html",L.rstrip("/")+"/"+t)
          save("nk_list_sp.html","https://keirin.netkeiba.com/race/race_list/?kaisai_date=20261115")
          save("kj_top.html","https://keirin.jp/pc/top")
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
