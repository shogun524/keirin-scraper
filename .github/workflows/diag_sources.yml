name: diag_sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests
          S=requests.Session(); S.headers["User-Agent"]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for rid in ["202611152801","202611152803"]:
              r=S.get(f"https://keirin.netkeiba.com/race/result/?race_id={rid}",timeout=20); open(f"res_{rid}.html","wb").write(r.content); print(rid,r.status_code,len(r.content),"未公開" if "レース結果決定後に公開" in r.text else "公開")
          PY
      - uses: actions/checkout@v4
        with: { path: repo }
      - run: |
          cd repo && git checkout --orphan diag-pages && git rm -rqf . && cp ../out/* . && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm diag && git push -qf origin diag-pages
